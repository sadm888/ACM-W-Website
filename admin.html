<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ACM-W NITK</title>
  <link rel="icon" type="image/x-icon" href="images/icons/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/font.css">
  <link rel="stylesheet" href="css/colour.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-header">
    <div class="admin-header-left">
      <img src="images/acmw_logo.png" alt="ACM-W NITK logo" class="admin-logo">
      <h1>&#9881; Admin</h1>
    </div>
    <a href="index.html" class="btn-back"><i class="fa fa-arrow-left"></i> &nbsp;Back to site</a>
  </div>

  <!-- Section tabs -->
  <div class="admin-tabs">
    <div class="admin-tabs-inner">
      <button type="button" class="admin-tab active" id="tab-members" onclick="switchTab('members')">
        <i class="fa fa-users"></i> Members
      </button>
      <button type="button" class="admin-tab" id="tab-events" onclick="switchTab('events')">
        <i class="fa fa-calendar"></i> Events
      </button>
    </div>
  </div>

  <!-- ═══════════════ MEMBERS SECTION ═══════════════ -->
  <div id="membersSection" class="admin-body">

    <div class="status-bar">
      <div class="status-info"><strong id="memberCount">0</strong> members</div>
      <div class="status-bar-right">
        <button type="button" class="btn-export" onclick="exportMembersJSON()" title="Download members.json to make changes permanent">
          <i class="fa fa-download"></i> Export JSON
        </button>
        <button type="button" class="btn-add-member" onclick="resetForm(); document.querySelector('#membersSection .form-panel').scrollIntoView({ behavior: 'smooth' });">
          <i class="fa fa-plus"></i> Add Member
        </button>
        <div class="save-indicator" id="saveIndicator"><i class="fa fa-circle-check"></i> Saved</div>
      </div>
    </div>

    <div class="members-panel">
      <div class="section-title">Current Members <span class="section-note">— drag to reorder</span></div>
      <div class="member-list" id="memberList"></div>
    </div>

    <div class="form-panel">
      <div class="form-title" id="formTitle">Add New Member</div>
      <input type="hidden" id="editIndex" value="-1">

      <div class="form-group">
        <label class="form-label" for="fName">Full Name</label>
        <input type="text" id="fName" placeholder="e.g. Priya Sharma">
      </div>
      <div class="form-group">
        <label class="form-label" for="fRole">Role</label>
        <input type="text" id="fRole" placeholder="e.g. Chairperson">
      </div>
      <div class="form-group">
        <label class="form-label">Photo</label>
        <div class="photo-zone" id="photoZone" onclick="document.getElementById('fPhotoFile').click()" title="Click to upload photo">
          <img class="photo-zone-img" id="photoPreview" src="" alt="Member photo">
          <div class="photo-zone-placeholder">
            <i class="fa fa-camera"></i>
            <span>Click to upload</span>
          </div>
          <input type="file" id="fPhotoFile" accept="image/*" class="hidden-file-input" aria-label="Upload member photo" onchange="handlePhotoUpload(this)">
        </div>
        <div class="old-photo-note" id="oldPhotoNote"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="fLinkedin">LinkedIn URL</label>
        <input type="url" id="fLinkedin" placeholder="https://linkedin.com/in/...">
      </div>
      <div class="form-group">
        <label class="form-label" for="fInstagram">Instagram URL</label>
        <input type="url" id="fInstagram" placeholder="https://instagram.com/...">
      </div>

      <div class="form-actions">
        <button type="button" class="btn-save" onclick="saveMember()">
          <i class="fa fa-check"></i> &nbsp;<span id="saveLabel">Add Member</span>
        </button>
        <button type="button" class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
      </div>
    </div>

  </div>

  <!-- ═══════════════ EVENTS SECTION ═══════════════ -->
  <div id="eventsSection" class="admin-body admin-section-hidden">

    <div class="status-bar">
      <div class="status-info">
        <strong id="eventCount">0</strong> events
        &nbsp;·&nbsp; <span id="pastCount">0</span> past &nbsp;·&nbsp; <span id="upcomingCount">0</span> upcoming
      </div>
      <div class="status-bar-right">
        <button type="button" class="btn-add-member" onclick="resetEventForm(); document.querySelector('#eventsSection .form-panel').scrollIntoView({ behavior: 'smooth' });">
          <i class="fa fa-plus"></i> Add Event
        </button>
        <div class="save-indicator" id="saveIndicatorEv"><i class="fa fa-circle-check"></i> Saved</div>
      </div>
    </div>

    <div class="members-panel">
      <div class="section-title">All Events</div>
      <div class="member-list" id="eventList"></div>
    </div>

    <div class="form-panel">
      <div class="form-title" id="eventFormTitle">Add New Event</div>
      <input type="hidden" id="eEditIndex" value="-1">

      <div class="form-group">
        <label class="form-label" for="eName">Event Name</label>
        <input type="text" id="eName" placeholder="e.g. RecHERsion 2025">
      </div>
      <div class="form-group">
        <label class="form-label" for="eDesc">Description</label>
        <textarea id="eDesc" rows="5" placeholder="Describe the event..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Photo</label>
        <div class="photo-zone" id="ePhotoZone" onclick="document.getElementById('ePhotoFile').click()" title="Click to upload photo">
          <img class="photo-zone-img" id="ePhotoPreview" src="" alt="Event photo">
          <div class="photo-zone-placeholder">
            <i class="fa fa-image"></i>
            <span>Click to upload</span>
          </div>
          <input type="file" id="ePhotoFile" accept="image/*" class="hidden-file-input" aria-label="Upload event photo" onchange="handleEventPhotoUpload(this)">
        </div>
        <div class="old-photo-note" id="eOldPhotoNote"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Event Type</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="eType" value="past" checked> Past Event
          </label>
          <label class="radio-option">
            <input type="radio" name="eType" value="upcoming"> Upcoming Event
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-save" onclick="saveEvent()">
          <i class="fa fa-check"></i> &nbsp;<span id="eSaveLabel">Add Event</span>
        </button>
        <button type="button" class="btn-cancel" id="eCancelBtn" onclick="cancelEventEdit()">Cancel</button>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

<script>
  // ════════════════════════════════════════════════════
  //  MEMBERS
  // ════════════════════════════════════════════════════
  const STORAGE_KEY = "acmw_members";
  const STORAGE_VER = "v2";
  let members = [];
  let dragSrc = null;
  let currentPhotoData = null;

  const stored    = localStorage.getItem(STORAGE_KEY);
  const storedVer = localStorage.getItem(STORAGE_KEY + "_ver");
  if (stored && storedVer === STORAGE_VER) {
    members = JSON.parse(stored);
    renderList();
  } else {
    localStorage.removeItem(STORAGE_KEY);
    fetch("members.json")
      .then(r => r.json())
      .then(data => { members = data; persist(); renderList(); })
      .catch(() => { members = []; renderList(); });
  }

  let _saveTimer = null;
  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
    localStorage.setItem(STORAGE_KEY + "_ver", STORAGE_VER);
    const ind = document.getElementById("saveIndicator");
    ind.style.opacity = '1';
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => { ind.style.opacity = '0'; }, 2000);
  }

  function renderList() {
    const list = document.getElementById("memberList");
    document.getElementById("memberCount").textContent = members.length;
    if (members.length === 0) {
      list.innerHTML = `<div class="empty-state"><i class="fa fa-users"></i>No members yet. Add one using the form.</div>`;
      return;
    }
    list.innerHTML = members.map((m, i) => `
      <div class="member-row" draggable="true" data-index="${i}"
           ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event)"
           ondrop="onDrop(event,${i})" ondragleave="onDragLeave(event)" ondragend="onDragEnd(event)">
        <span class="drag-handle" title="Drag to reorder"><i class="fa fa-grip-vertical"></i></span>
        <img src="${m.photo}" alt="${m.name}" onerror="this.src='images/members/dummy.jpg'">
        <div class="member-info">
          <div class="m-name">${m.name}</div>
          <div class="m-role">${m.role}</div>
        </div>
        <div class="member-actions">
          <button type="button" class="btn-icon btn-edit" title="Edit" onclick="editMember(${i})"><i class="fa fa-pen"></i></button>
          <button type="button" class="btn-icon btn-delete" title="Delete" onclick="deleteMember(${i})"><i class="fa fa-trash"></i></button>
        </div>
      </div>
    `).join("");
  }

  function saveMember() {
    const name      = document.getElementById("fName").value.trim();
    const role      = document.getElementById("fRole").value.trim();
    const linkedin  = document.getElementById("fLinkedin").value.trim();
    const instagram = document.getElementById("fInstagram").value.trim();
    if (!name || !role) { showToast("Name and Role are required", "error"); return; }
    const idx = parseInt(document.getElementById("editIndex").value);
    const existingPhoto = idx >= 0 ? members[idx].photo : "images/members/dummy.jpg";
    const photo = currentPhotoData || existingPhoto;
    const member = { name, role, photo, linkedin, instagram };
    if (idx === -1) {
      members.push(member);
      showToast(`${name} added!`, "success");
    } else {
      members[idx] = member;
      showToast(`${name} updated!`, "success");
    }
    persist(); renderList(); resetForm();
  }

  function editMember(i) {
    const currentIdx = parseInt(document.getElementById("editIndex").value);
    const isDirty = document.getElementById("fName").value.trim() !== "" ||
                    document.getElementById("fRole").value.trim() !== "";
    if (isDirty && currentIdx === -1) {
      if (!confirm("You have unsaved changes. Discard and edit this member?")) return;
    }
    const m = members[i];
    currentPhotoData = null;
    document.getElementById("editIndex").value   = i;
    document.getElementById("fName").value       = m.name;
    document.getElementById("fRole").value       = m.role;
    document.getElementById("fLinkedin").value   = m.linkedin || "";
    document.getElementById("fInstagram").value  = m.instagram || "";
    document.getElementById("formTitle").textContent = "Edit Member";
    document.getElementById("saveLabel").textContent = "Save Changes";
    document.getElementById("cancelBtn").classList.add("visible");
    showPhotoInZone(m.photo);
    const note = document.getElementById("oldPhotoNote");
    if (m.photo && !m.photo.includes("dummy") && !m.photo.startsWith("data:")) {
      note.textContent = "Uploading a new photo will replace this one.";
      note.style.display = "block";
    } else {
      note.style.display = "none";
    }
    document.querySelectorAll(".member-row").forEach(r => r.classList.remove("editing"));
    document.querySelector(`.member-row[data-index="${i}"]`)?.classList.add("editing");
    document.querySelector("#membersSection .form-panel").scrollIntoView({ behavior: "smooth" });
  }

  function deleteMember(i) {
    const name = members[i].name;
    if (!confirm(`Delete ${name}?`)) return;
    members.splice(i, 1); persist(); renderList(); resetForm();
    showToast(`${name} removed`, "success");
  }

  function cancelEdit() { resetForm(); }

  function resetForm() {
    currentPhotoData = null;
    document.getElementById("editIndex").value       = -1;
    document.getElementById("fName").value           = "";
    document.getElementById("fRole").value           = "";
    document.getElementById("fLinkedin").value       = "";
    document.getElementById("fInstagram").value      = "";
    document.getElementById("formTitle").textContent = "Add New Member";
    document.getElementById("saveLabel").textContent = "Add Member";
    document.getElementById("cancelBtn").classList.remove("visible");
    document.getElementById("oldPhotoNote").style.display = "none";
    document.getElementById("fPhotoFile").value      = "";
    showPhotoInZone(null);
    document.querySelectorAll(".member-row").forEach(r => r.classList.remove("editing"));
  }

  function showPhotoInZone(src) {
    const zone    = document.getElementById("photoZone");
    const preview = document.getElementById("photoPreview");
    if (src) {
      preview.src = src;
      preview.onload  = () => zone.classList.add("has-photo");
      preview.onerror = () => zone.classList.remove("has-photo");
    } else {
      preview.src = "";
      zone.classList.remove("has-photo");
    }
  }

  function handlePhotoUpload(input) {
    if (!input.files || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = e => { currentPhotoData = e.target.result; showPhotoInZone(e.target.result); };
    reader.readAsDataURL(input.files[0]);
  }

  function onDragStart(e, i) { dragSrc = i; e.currentTarget.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; }
  function onDragOver(e)  { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
  function onDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
  function onDragEnd(e)   { e.currentTarget.classList.remove("dragging"); }
  function onDrop(e, i) {
    e.preventDefault();
    e.currentTarget.classList.remove("drag-over");
    if (dragSrc === null || dragSrc === i) return;
    const editIdx = parseInt(document.getElementById("editIndex").value);
    const moved = members.splice(dragSrc, 1)[0];
    members.splice(i, 0, moved);
    dragSrc = null;
    persist(); renderList();
    if (editIdx >= 0) resetForm();
  }

  // ════════════════════════════════════════════════════
  //  EVENTS
  // ════════════════════════════════════════════════════
  const EV_KEY = "acmw_events";
  const EV_VER = "v1";

  const DEFAULT_EVENTS = [
    { id: 4, name: "Talk with Anubha Maneshwar", desc: "We hosted Anubha Maneshwar (founding director of GirlScript) live on our Instagram handle! Viewers learnt about GirlScript Foundation; the inception, journey, her motivation, roadblocks and where Anubha wants to take it in the future. She also shared her opinions on the 'women in tech' movement, entrepreneurship and our education system. The 'Question and Answer' session saw questions on technology, entrepreneurship, profile building, resume writing, community building, professional communication and leadership to which Anubha gave her take on and provided insightful answers.", photo: "images/anubha.jpeg", type: "past" },
    { id: 3, name: "RecHERsion 2020", desc: "Hello there, women of technology! There is no gate, no lock, no bolt. Here's an opportunity for you to follow in the footsteps of greats such as Margaret Hamilton and Grace Mary Hopper. ACM-W, NITK in collaboration with ACM-W, VIT sponsored by Coding Blocks present to you an opportunity to code, compete and show us what you got at an all girls coding contest, RecHERsion.", photo: "images/rechersion.jpg", type: "past" },
    { id: 2, name: "Women Emerging in Finance 2019", desc: "ACM-W presents Women Emerging in Finance 2019, an informal networking opportunity for girls across all years, branches and programs in NITK to interact with women leaders of the firm with the goal of identifying talented women, giving deep insight into the world of finance and creating awareness about the plethora of opportunities at the company.", photo: "images/gs.jpg", type: "past" },
    { id: 1, name: "Open Source Kick Start", desc: "With Hactoberfest 2020 going on in full swing, we at ACM-W invite all open source enthusiasts to contribute to our organisation and watch your work being deployed! Come and get a feel of how most GSoC organisations work and familiarise yourself with Open Source projects.", photo: "images/open.jpg", type: "past" }
  ];

  let events = [];
  let currentEventPhotoData = null;

  const evStored    = localStorage.getItem(EV_KEY);
  const evStoredVer = localStorage.getItem(EV_KEY + "_ver");
  if (evStored && evStoredVer === EV_VER) {
    events = JSON.parse(evStored);
  } else {
    events = JSON.parse(JSON.stringify(DEFAULT_EVENTS));
    persistEvents();
  }
  renderEventList();

  let _evSaveTimer = null;
  function persistEvents() {
    localStorage.setItem(EV_KEY, JSON.stringify(events));
    localStorage.setItem(EV_KEY + "_ver", EV_VER);
    const ind = document.getElementById("saveIndicatorEv");
    ind.style.opacity = '1';
    clearTimeout(_evSaveTimer);
    _evSaveTimer = setTimeout(() => { ind.style.opacity = '0'; }, 2000);
  }

  function renderEventList() {
    const list = document.getElementById("eventList");
    const pastCount     = events.filter(e => e.type === "past").length;
    const upcomingCount = events.filter(e => e.type === "upcoming").length;
    document.getElementById("eventCount").textContent    = events.length;
    document.getElementById("pastCount").textContent     = pastCount;
    document.getElementById("upcomingCount").textContent = upcomingCount;

    if (events.length === 0) {
      list.innerHTML = `<div class="empty-state"><i class="fa fa-calendar"></i>No events yet. Add one using the form.</div>`;
      return;
    }

    list.innerHTML = events.map((ev, i) => `
      <div class="member-row event-row" data-index="${i}">
        <img src="${ev.photo}" alt="${ev.name}" class="event-row-thumb"
             onerror="this.src='images/members/dummy.jpg'">
        <div class="member-info">
          <div class="m-name">${ev.name}</div>
          <div class="m-role">${ev.desc.length > 80 ? ev.desc.slice(0, 80) + '…' : ev.desc}</div>
        </div>
        <span class="event-type-badge event-type-${ev.type}">${ev.type === 'past' ? 'Past' : 'Upcoming'}</span>
        <div class="member-actions">
          <button type="button" class="btn-icon btn-edit" title="Edit" onclick="editEvent(${i})"><i class="fa fa-pen"></i></button>
          <button type="button" class="btn-icon btn-delete" title="Delete" onclick="deleteEvent(${i})"><i class="fa fa-trash"></i></button>
        </div>
      </div>
    `).join("");
  }

  function saveEvent() {
    const name = document.getElementById("eName").value.trim();
    const desc = document.getElementById("eDesc").value.trim();
    const type = document.querySelector('input[name="eType"]:checked').value;
    if (!name || !desc) { showToast("Name and Description are required", "error"); return; }

    const idx = parseInt(document.getElementById("eEditIndex").value);
    const existingPhoto = idx >= 0 ? events[idx].photo : "images/members/dummy.jpg";
    const photo = currentEventPhotoData || existingPhoto;

    const ev = { id: idx === -1 ? Date.now() : events[idx].id, name, desc, photo, type };

    if (idx === -1) {
      events.push(ev);
      showToast(`"${name}" added!`, "success");
    } else {
      events[idx] = ev;
      showToast(`"${name}" updated!`, "success");
    }
    persistEvents(); renderEventList(); resetEventForm();
  }

  function editEvent(i) {
    const ev = events[i];
    currentEventPhotoData = null;
    document.getElementById("eEditIndex").value = i;
    document.getElementById("eName").value      = ev.name;
    document.getElementById("eDesc").value      = ev.desc;
    document.querySelector(`input[name="eType"][value="${ev.type}"]`).checked = true;
    document.getElementById("eventFormTitle").textContent = "Edit Event";
    document.getElementById("eSaveLabel").textContent     = "Save Changes";
    document.getElementById("eCancelBtn").classList.add("visible");
    showEventPhotoInZone(ev.photo);
    const note = document.getElementById("eOldPhotoNote");
    if (ev.photo && !ev.photo.startsWith("data:")) {
      note.textContent = "Uploading a new photo will replace the current one.";
      note.style.display = "block";
    } else {
      note.style.display = "none";
    }
    document.querySelectorAll(".event-row").forEach(r => r.classList.remove("editing"));
    document.querySelector(`.event-row[data-index="${i}"]`)?.classList.add("editing");
    document.querySelector("#eventsSection .form-panel").scrollIntoView({ behavior: "smooth" });
  }

  function deleteEvent(i) {
    const name = events[i].name;
    if (!confirm(`Delete "${name}"?`)) return;
    events.splice(i, 1); persistEvents(); renderEventList(); resetEventForm();
    showToast(`"${name}" removed`, "success");
  }

  function cancelEventEdit() { resetEventForm(); }

  function resetEventForm() {
    currentEventPhotoData = null;
    document.getElementById("eEditIndex").value = -1;
    document.getElementById("eName").value      = "";
    document.getElementById("eDesc").value      = "";
    document.querySelector('input[name="eType"][value="past"]').checked = true;
    document.getElementById("eventFormTitle").textContent = "Add New Event";
    document.getElementById("eSaveLabel").textContent     = "Add Event";
    document.getElementById("eCancelBtn").classList.remove("visible");
    document.getElementById("eOldPhotoNote").style.display = "none";
    document.getElementById("ePhotoFile").value = "";
    showEventPhotoInZone(null);
    document.querySelectorAll(".event-row").forEach(r => r.classList.remove("editing"));
  }

  function showEventPhotoInZone(src) {
    const zone    = document.getElementById("ePhotoZone");
    const preview = document.getElementById("ePhotoPreview");
    if (src) {
      preview.src     = src;
      preview.onload  = () => zone.classList.add("has-photo");
      preview.onerror = () => zone.classList.remove("has-photo");
    } else {
      preview.src = "";
      zone.classList.remove("has-photo");
    }
  }

  function handleEventPhotoUpload(input) {
    if (!input.files || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = e => { currentEventPhotoData = e.target.result; showEventPhotoInZone(e.target.result); };
    reader.readAsDataURL(input.files[0]);
  }

  // ════════════════════════════════════════════════════
  //  SHARED
  // ════════════════════════════════════════════════════
  function exportMembersJSON() {
    const data = JSON.stringify(members, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'members.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('members.json downloaded — replace the file on disk to make changes permanent.');
  }

  function switchTab(tab) {
    document.getElementById("membersSection").style.display = tab === "members" ? "grid" : "none";
    document.getElementById("eventsSection").style.display  = tab === "events"  ? "grid" : "none";
    document.getElementById("tab-members").classList.toggle("active", tab === "members");
    document.getElementById("tab-events").classList.toggle("active", tab === "events");
  }

  function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove("show"), 3000);
  }
</script>
</body>
</html>
